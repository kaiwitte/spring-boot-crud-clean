---
name: "Tests"
"on":
  push:
    branches:
    - "develop"
    - "main"
  pull_request: null
permissions:
  contents: "read"
jobs:
  test:
    name: "Gradle Test"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Check out repository"
      uses: "actions/checkout@v5"
    - name: "Set up Java"
      uses: "actions/setup-java@v5"
      with:
        distribution: "temurin"
        java-version: "21"
    - name: "Set up Gradle"
      uses: "gradle/actions/setup-gradle@v5"
    - name: "Run checks"
      run: "./gradlew check"
