<app-abstract-item-shell [state]="state()" [entityName]="entityName()" [backLink]="backLink()">
  @if (item(); as loadedItem) {
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ heading(loadedItem) }}</mat-card-title>
        <mat-card-subtitle>{{ entityName() }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <dl class="grid grid-cols-[auto_1fr] gap-x-8 gap-y-2 py-4">
          @for (field of fields(); track field.label) {
            <dt class="font-medium">{{ field.label }}</dt>
            <dd class="break-all">{{ field.value(loadedItem) }}</dd>
          }
        </dl>
      </mat-card-content>
      <mat-card-actions class="flex gap-2">
        <a matButton [routerLink]="[...backLink()]">
          <mat-icon>arrow_back</mat-icon>
          Back
        </a>
        @if (editLink(); as link) {
          <a matButton [routerLink]="[...link]">
            <mat-icon>edit</mat-icon>
            Edit
          </a>
        }
        <button matButton type="button" (click)="deleteRequested.emit()">
          <mat-icon>delete</mat-icon>
          Delete
        </button>
      </mat-card-actions>
    </mat-card>
  }
</app-abstract-item-shell>
